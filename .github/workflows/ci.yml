name: CI

on:
  pull_request:
  push:
    branches: [development, main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - run: pnpm install
      - run: pnpm turbo lint
      - run: pnpm turbo typecheck
      - run: pnpm turbo build
